name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [staging, main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check app ml tests

      - name: Pytest
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (smoke build, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: app:ci-${{ github.sha }}

  build-staging-image:
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [lint-test, docker-build]
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repo name (Docker tags must be lowercase)
        run: echo "REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Generate staging .env from secrets
        run: |
          cat > .env <<EOF
          APP_ENV=staging
          LOG_LEVEL=debug
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}:staging-${{ github.sha }}

  build-prod-image:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [lint-test, docker-build]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repo name (Docker tags must be lowercase)
        run: echo "REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Generate production .env from secrets
        run: |
          cat > .env <<EOF
          APP_ENV=production
          LOG_LEVEL=info
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}:prod-${{ github.sha }}
            ghcr.io/${{ env.REPO_LC }}:latest
